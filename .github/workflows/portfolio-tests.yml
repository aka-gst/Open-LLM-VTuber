name: Portfolio tests

on:
  push:
    branches: [main, feat/local-agent-gateway]
  pull_request:

permissions:
  contents: read

jobs:
  local-voice-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install pytest pyttsx3 loguru pydantic PyYAML
      - name: Run portfolio regression tests
        run: python -m pytest -q tests/portfolio
